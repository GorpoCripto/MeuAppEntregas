<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STI — Rota do Jornal</title>
<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  display:none;
}

header{
  background:#1f2937;
  color:#fff;
  padding:22px 20px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  color:#d1d5db;
}

.conteudo{
  padding:20px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

select,
input,
button{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:16px;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.campo{
  margin-bottom:18px;
}

.cidadeLinha{
  display:flex;
  gap:8px;
}

.cidadeLinha select{
  flex:1;
}

.cidadeLinha button{
  width:auto;
  white-space:nowrap;
  background:#16a34a;
}

.resumo{
  margin:20px 0;
  padding:15px;
  background:#eef2ff;
  border-radius:10px;
}

.resumo strong{
  font-size:18px;
}

.estatisticas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.estatistica{
  padding:13px;
  border-radius:10px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
}

.estatistica .titulo{
  font-size:13px;
  color:#64748b;
  margin-bottom:5px;
}

.estatistica .numero{
  font-size:21px;
  font-weight:bold;
}

.filtrosStatus{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}

.filtroStatus{
  background:#e5e7eb;
  color:#374151;
}

.filtroStatus.ativo{
  background:#2563eb;
  color:#fff;
}

.badge{
  display:inline-block;
  margin-left:5px;
  background:rgba(255,255,255,.25);
  padding:2px 7px;
  border-radius:20px;
  font-size:13px;
}

.filtroStatus:not(.ativo) .badge{
  background:#d1d5db;
}

.gerenciarEntrega{
  grid-column:1 / -1;
}

.gerenciarEntrega summary{
  list-style:none;
  background:#e5e7eb;
  color:#374151;
  padding:13px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
}

.gerenciarEntrega summary::-webkit-details-marker{
  display:none;
}

.gerenciarEntrega[open] summary{
  background:#2563eb;
  color:#fff;
}

.gerenciarEntrega button{
  margin-top:8px;
}

.empresa{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-bottom:12px;
}

.empresa h3{
  margin:0 0 7px;
}

.endereco{
  color:#666;
  margin-bottom:10px;
}

.informacoes{
  margin-bottom:10px;
  font-size:15px;
}

.informacoes div{
  margin-bottom:4px;
}

.status{
  font-weight:bold;
  margin-bottom:10px;
}

.statusPendente{
  color:#dc2626;
}

.statusEntregue{
  color:#16a34a;
}

.acoes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.mapa{
  background:#16a34a;
}

.mapa:hover{
  background:#15803d;
}

.entregar{
  background:#2563eb;
}

.pendenteNovamente{
  background:#f59e0b;
}

.editar{
  background:#2563eb;
}

.excluir{
  background:#dc2626;
}

.excluir:hover{
  background:#b91c1c;
}

.carregando{
  text-align:center;
  padding:30px;
  color:#666;
}

.vazio{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

#loginTela{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginCaixa{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:30px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  text-align:center;
}

.loginCaixa h1{
  margin-top:0;
}

.loginCaixa p{
  color:#666;
  margin-bottom:25px;
}

#entrarGoogle{
  background:#2563eb;
}

#usuarioArea{
  margin-top:12px;
  font-size:14px;
  color:#d1d5db;
}

#sair{
  margin-top:10px;
  width:auto;
  padding:8px 14px;
  font-size:14px;
  background:#374151;
}

#mensagem{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  background:#fee2e2;
  color:#991b1b;
  font-size:14px;
}

.fundoObsoletas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.65);
  z-index:9999;
  overflow-y:auto;
  padding:20px;
}

.caixaObsoletas{
  background:#fff;
  max-width:700px;
  margin:20px auto;
  border-radius:15px;
  padding:20px;
}

.cardObsoleta{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-bottom:15px;
}

.cardObsoleta h3{
  margin-top:0;
}

.botoesObsoleta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.restaurar{
  background:#16a34a;
}

.excluirDefinitivo{
  background:#dc2626;
}

.fecharObsoletas{
  background:#555;
  margin-bottom:20px;
}

.progressoRota{
  background:#eef2ff;
  padding:15px;
  border-radius:10px;
  text-align:center;
  margin-bottom:15px;
}

.distanciaRota{
  font-size:15px;
  color:#374151;
  margin-top:8px;
}

@media(max-width:500px){

  .filtrosStatus{
    grid-template-columns:1fr;
  }

  .acoes{
    grid-template-columns:1fr 1fr;
  }

}
</style>
</head>

<body>

<div id="loginTela">

  <div class="loginCaixa">

    <h1>📰 STI — Rota do Jornal</h1>

    <p>
      Entre com sua conta Google para acessar suas entregas.
    </p>

    <button id="entrarGoogle">
      🔐 Entrar com Google
    </button>

    <div id="mensagem"></div>

  </div>

</div>


<div class="app">

  <header>

    <h1>📰 STI — Rota do Jornal</h1>

    <p>
      Organizador das suas entregas
    </p>

    <div id="usuarioArea">

      <span id="usuarioEmail"></span>

      <br>

      <button id="sair">
        Sair
      </button>

    </div>

  </header>


  <div class="conteudo">

    <div class="campo">

      <label for="cidade">
        Cidade
      </label>

      <div class="cidadeLinha">

        <select id="cidade"></select>

        <button id="adicionarCidade">
          + Cidade
        </button>

      </div>

    </div>


    <button id="adicionar">
      + Cadastrar empresa
    </button>


    <div class="resumo">

      <strong id="tituloRota">
        Salto
      </strong>

      <br>

      <span id="contador">
        0 empresas
      </span>

    </div>


    <div class="estatisticas">

      <div class="estatistica">

        <div class="titulo">
          🏢 Total de empresas
        </div>

        <div class="numero" id="totalEmpresas">
          0
        </div>

      </div>


      <div class="estatistica">

        <div class="titulo">
          👥 Total funcionários
        </div>

        <div class="numero" id="totalFuncionarios">
          0
        </div>

      </div>


      <div class="estatistica">

        <div class="titulo">
          📰 Jornais entregues
        </div>

        <div class="numero" id="jornaisEntregues">
          0
        </div>

      </div>


      <div class="estatistica">

        <div class="titulo">
          📰 Jornais faltando
        </div>

        <div class="numero" id="jornaisFaltando">
          0
        </div>

      </div>

    </div>


    <div class="filtrosStatus">

      <button id="btnPendentes" class="filtroStatus ativo">

        🔴 Pendentes

        <span id="badgePendentes" class="badge">
          0
        </span>

      </button>


      <button id="btnEntregues" class="filtroStatus">

        🟢 Entregues

        <span id="badgeEntregues" class="badge">
          0
        </span>

      </button>


      <button id="btnProximaEntrega" class="filtroStatus">

        🗺️ Próxima entrega

      </button>


      <button id="btnObsoletas" class="filtroStatus">

        🚫 Obsoletas

      </button>


      <details class="gerenciarEntrega">

        <summary>
          ⚙️ Gerenciar entrega
        </summary>

        <button id="novaEntrega" class="filtroStatus">

          🔄 Iniciar nova entrega

        </button>

      </details>

    </div>


    <div id="lista">

      <div class="carregando">
        Carregando empresas...
      </div>

    </div>

  </div>

</div>


<script type="module">

console.error("MODULO INICIOU");

import {
  initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  query,
  where,
  serverTimestamp,
  getDoc,
  setDoc
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCD_pBQlMyrPucvK7ruSRM0wFiKmRHkrlc",

  authDomain:
    "meuappentregas-8829f.firebaseapp.com",

  projectId:
    "meuappentregas-8829f",

  storageBucket:
    "meuappentregas-8829f.firebasestorage.app",

  messagingSenderId:
    "812561892421",

  appId:
    "1:812561892421:web:ffc5c628a15a36c8384f2c"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const provider =
  new GoogleAuthProvider();


const db =
  getFirestore(app);


const loginTela =
  document.getElementById("loginTela");


const entrarGoogle =
  document.getElementById("entrarGoogle");


const mensagem =
  document.getElementById("mensagem");


const appTela =
  document.querySelector(".app");


const usuarioEmail =
  document.getElementById("usuarioEmail");


const sair =
  document.getElementById("sair");


const cidade =
  document.getElementById("cidade");


const lista =
  document.getElementById("lista");


const contador =
  document.getElementById("contador");


const tituloRota =
  document.getElementById("tituloRota");


const adicionar =
  document.getElementById("adicionar");


const adicionarCidade =
  document.getElementById("adicionarCidade");


const btnPendentes =
  document.getElementById("btnPendentes");


const btnEntregues =
  document.getElementById("btnEntregues");


const novaEntrega =
  document.getElementById("novaEntrega");


const btnProximaEntrega =
  document.getElementById("btnProximaEntrega");


const btnObsoletas =
  document.getElementById("btnObsoletas");


const badgePendentes =
  document.getElementById("badgePendentes");


const badgeEntregues =
  document.getElementById("badgeEntregues");


const totalEmpresas =
  document.getElementById("totalEmpresas");


const totalFuncionarios =
  document.getElementById("totalFuncionarios");


const jornaisEntregues =
  document.getElementById("jornaisEntregues");


const jornaisFaltando =
  document.getElementById("jornaisFaltando");


let usuarioAtual = null;

let filtroAtual = "pendentes";


const cidadesIniciais = [
  "Salto",
  "Itu",
  "Indaiatuba"
];


function mostrarMensagem(texto){

  mensagem.textContent = texto;

  mensagem.style.display = "block";

}

console.error("LOGIN BLOCO EXECUTOU");

entrarGoogle.addEventListener(
  "click",
  async()=>{

    mensagem.style.display = "none";

    try{

      await signInWithPopup(
        auth,
        provider
      );

    }catch(error){

      console.error(
        "Erro no login:",
        error
      );

      mostrarMensagem(
        "Não foi possível entrar com Google."
      );

    }

  }
);


sair.addEventListener(
  "click",
  async()=>{

    try{

      await signOut(auth);

    }catch(error){

      console.error(
        "Erro ao sair:",
        error
      );

    }

  }
);


async function carregarCidades(){

  if(!usuarioAtual)return;

  try{

    const usuarioRef =
      doc(
        db,
        "usuarios",
        usuarioAtual.uid
      );


    const resultado =
      await getDoc(usuarioRef);


    let cidades;


    if(resultado.exists()){

      const dados =
        resultado.data();


      cidades =
        Array.isArray(dados.cidades)
        &&
        dados.cidades.length > 0
        ?
        dados.cidades
        :
        [...cidadesIniciais];

    }else{

      cidades =
        [...cidadesIniciais];


      await setDoc(
        usuarioRef,
        {
          cidades:cidades,
          criadoEm:serverTimestamp()
        }
      );

    }


    cidade.innerHTML = "";


    cidades.forEach(
      nomeCidade=>{

        const option =
          document.createElement("option");


        option.value =
          nomeCidade;


        option.textContent =
          nomeCidade;


        cidade.appendChild(option);

      }
    );


    if(cidade.options.length > 0){

      cidade.selectedIndex = 0;

    }


    atualizarTitulo();

    await mostrarEmpresas();


  }catch(error){

    console.error(
      "Erro ao carregar cidades:",
      error
    );


    lista.innerHTML = `

      <div class="vazio">

        ⚠️ Não foi possível carregar as cidades.

      </div>

    `;

  }

}


function atualizarTitulo(){

  tituloRota.textContent =
    cidade.value;

}


adicionarCidade.addEventListener(
  "click",
  async()=>{

    if(!usuarioAtual){

      alert(
        "Você precisa entrar primeiro."
      );

      return;

    }


    const novaCidade =
      prompt(
        "Digite o nome da nova cidade:"
      );


    if(!novaCidade)return;


    const nome =
      novaCidade.trim();


    if(!nome)return;


    try{

      const usuarioRef =
        doc(
          db,
          "usuarios",
          usuarioAtual.uid
        );


      const resultado =
        await getDoc(usuarioRef);


      let cidades;


      if(resultado.exists()){

        const dados =
          resultado.data();


        cidades =
          Array.isArray(dados.cidades)
          ?
          [...dados.cidades]
          :
          [...cidadesIniciais];

      }else{

        cidades =
          [...cidadesIniciais];

      }


      const existe =
        cidades.some(
          item=>
            item.toLowerCase()
            ===
            nome.toLowerCase()
        );


      if(existe){

        alert(
          "Essa cidade já está cadastrada."
        );

        return;

      }


      cidades.push(nome);


      await setDoc(
        usuarioRef,
        {
          cidades:cidades
        },
        {
          merge:true
        }
      );


      await carregarCidades();


      cidade.value =
        nome;


      atualizarTitulo();


      filtroAtual =
        "pendentes";


      atualizarBotoesFiltro();


      await mostrarEmpresas();


    }catch(error){

      console.error(
        "Erro ao adicionar cidade:",
        error
      );


      alert(
        "Não foi possível salvar a nova cidade."
      );

    }

  }
);


async function buscarEmpresas(){

  if(!usuarioAtual)return[];


    const consulta =
    collection(
      db,
      "empresas"
    );


  const resultado =
    await getDocs(consulta);


  const empresas = [];


  resultado.forEach(
    documento=>{

      const dados =
        documento.data();


      if(
        dados.cidade !==
        cidade.value
      ){

        return;

      }


      if(
        dados.obsoleta === true
      ){

        return;

      }


      empresas.push({

        id:
          documento.id,

        ...dados,

        funcionarios:
          Number(dados.funcionarios)||0,

        jornais:
          Number(dados.jornais)||0

      });

    }
  );


  return empresas;

}


async function mostrarEmpresas(){

  if(!usuarioAtual)return;


  lista.innerHTML = `

    <div class="carregando">
      Carregando empresas...
    </div>

  `;


  try{

    const empresas =
      await buscarEmpresas();


    const pendentes =
      empresas.filter(
        empresa=>
          empresa.entregue !== true
      );


    const entregues =
      empresas.filter(
        empresa=>
          empresa.entregue === true
      );


    let funcionariosTotal = 0;

    let jornaisEntreguesTotal = 0;

    let jornaisPendentesTotal = 0;


    empresas.forEach(
      empresa=>{

        funcionariosTotal +=
          empresa.funcionarios;


        if(
          empresa.entregue === true
        ){

          jornaisEntreguesTotal +=
            empresa.jornais;

        }else{

          jornaisPendentesTotal +=
            empresa.jornais;

        }

      }
    );


    totalEmpresas.textContent =
      empresas.length;


    totalFuncionarios.textContent =
      funcionariosTotal;


    jornaisEntregues.textContent =
      jornaisEntreguesTotal;


    jornaisFaltando.textContent =
      jornaisPendentesTotal;


    badgePendentes.textContent =
      pendentes.length;


    badgeEntregues.textContent =
      entregues.length;


    contador.textContent =
      filtroAtual === "pendentes"
      ?
      `${pendentes.length} empresas faltando`
      :
      `${entregues.length} empresas entregues`;


    const empresasMostrar =
      filtroAtual === "pendentes"
      ?
      pendentes
      :
      entregues;


    lista.innerHTML = "";


    if(empresasMostrar.length === 0){

      lista.innerHTML = `

        <div class="vazio">

          ${
            filtroAtual === "pendentes"
            ?
            "📭 Nenhuma empresa pendente."
            :
            "📭 Nenhuma empresa entregue ainda."
          }

        </div>

      `;

      return;

    }


    empresasMostrar.forEach(
      empresa=>{

        const div =
          document.createElement("div");


        div.className =
          "empresa";


        const titulo =
          document.createElement("h3");


        titulo.textContent =
          "🏢 " + empresa.nome;


        const endereco =
          document.createElement("div");


        endereco.className =
          "endereco";


        endereco.textContent =
          "📍 " + empresa.endereco;


        const informacoes =
          document.createElement("div");


        informacoes.className =
          "informacoes";


        const funcionariosTexto =
          document.createElement("div");


        funcionariosTexto.textContent =
          "👥 " +
          empresa.funcionarios +
          " funcionários";


        const jornaisTexto =
          document.createElement("div");


        jornaisTexto.textContent =
          "📰 " +
          empresa.jornais +
          " jornais";


        informacoes.appendChild(
          funcionariosTexto
        );


        informacoes.appendChild(
          jornaisTexto
        );


        const status =
          document.createElement("div");


        status.className =
          "status";


        if(
          empresa.entregue === true
        ){

          status.classList.add(
            "statusEntregue"
          );


          status.textContent =
            "✅ Entregue";

        }else{

          status.classList.add(
            "statusPendente"
          );


          status.textContent =
            "⬜ Pendente";

        }


        const acoes =
          document.createElement("div");


        acoes.className =
          "acoes";


        const mapa =
          document.createElement("button");


        mapa.className =
          "mapa";


        mapa.textContent =
          "🧭 Ir até lá";


        mapa.addEventListener(
          "click",
          ()=>{

            const destino =
              encodeURIComponent(
                empresa.endereco +
                ", " +
                empresa.cidade
              );


            window.open(
              "https://www.google.com/maps/dir/?api=1" +
              "&destination=" +
              destino +
              "&travelmode=driving",
              "_blank"
            );

          }
        );


        const botaoEntrega =
          document.createElement("button");


        if(
          empresa.entregue === true
        ){

          botaoEntrega.className =
            "pendenteNovamente";


          botaoEntrega.textContent =
            "↩️ Pendente";


          botaoEntrega.addEventListener(
            "click",
            async()=>{

              await alterarEntrega(
                empresa.id,
                false
              );

            }
          );

        }else{

          botaoEntrega.className =
            "entregar";


          botaoEntrega.textContent =
            "✅ Entregue";


          botaoEntrega.addEventListener(
            "click",
            async()=>{

              await alterarEntrega(
                empresa.id,
                true
              );

            }
          );

        }


        const botaoEditar =
          document.createElement("button");


        botaoEditar.className =
          "editar";


        botaoEditar.textContent =
          "✏️ Editar";


        botaoEditar.addEventListener(
          "click",
          async()=>{

            await editarEmpresa(

function esperar(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/*
  Localiza o endereço da empresa.

  Faz três tentativas diferentes para aumentar
  a chance de encontrar endereços que o Nominatim
  não reconheça na primeira consulta.
*/

async function obterCoordenadas(
  endereco,
  cidadeNome
){

  const consultas = [

    endereco +
      ", " +
      cidadeNome +
      ", São Paulo, Brasil",

    endereco +
      ", " +
      cidadeNome +
      ", Brasil",

    endereco.replace(/\s*-\s*.*$/, "") +
      ", " +
      cidadeNome +
      ", São Paulo, Brasil"

  ];


  for(
    const consultaTexto of consultas
  ){

    try{

      const consulta =
        encodeURIComponent(
          consultaTexto
        );


      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&limit=1" +
        "&countrycodes=br" +
        "&q=" +
        consulta;


      const resposta =
        await fetch(url);


      if(!resposta.ok){

        continue;

      }


      const dados =
        await resposta.json();


      if(dados.length){

        return {

          latitude:
            Number(
              dados[0].lat
            ),

          longitude:
            Number(
              dados[0].lon
            )

        };

      }

    }catch(error){

      console.error(
        "Tentativa de localização falhou:",
        consultaTexto,
        error
      );

    }

  }


  return null;

}


/*
  Obtém a localização atual do aparelho.

  maximumAge:0
  obriga o navegador a tentar obter
  uma localização atual.

  enableHighAccuracy:true
  solicita a maior precisão disponível.
*/

function obterMinhaLocalizacao(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "Seu navegador não possui localização."
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        posicao=>{

          resolve({

            latitude:
              posicao.coords.latitude,

            longitude:
              posicao.coords.longitude

          });

        },


        erro=>{

          let mensagemErro =
            "Não foi possível obter sua localização.";


          if(
            erro.code === 1
          ){

            mensagemErro =
              "Permissão de localização negada. Ative a localização do navegador.";

          }


          if(
            erro.code === 2
          ){

            mensagemErro =
              "Não foi possível determinar sua localização.";

          }


          if(
            erro.code === 3
          ){

            mensagemErro =
              "O GPS demorou demais para responder.";

          }


          reject(
            new Error(
              mensagemErro
            )
          );

        },


        {

          enableHighAccuracy:true,

          timeout:30000,

          maximumAge:0

        }

      );

    }
  );

}


/*
  Calcula a distância em linha reta
  entre dois pontos usando a fórmula
  de Haversine.
*/

function calcularDistanciaKm(
  lat1,
  lon1,
  lat2,
  lon2
){

  const raioTerra =
    6371;


  const dLat =
    (lat2-lat1) *
    Math.PI /
    180;


  const dLon =
    (lon2-lon1) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2)

    +

    Math.cos(
      lat1 *
      Math.PI /
      180
    )

    *

    Math.cos(
      lat2 *
      Math.PI /
      180
    )

    *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return raioTerra * c;

}


/*
  Garante que todas as empresas pendentes
  possuam latitude e longitude.

  Se uma empresa não possuir coordenadas,
  o aplicativo tenta localizá-la novamente.
*/

async function garantirCoordenadas(
  empresas
){

  const semCoordenadas =
    empresas.filter(
      empresa =>
        typeof empresa.latitude !== "number"
        ||
        typeof empresa.longitude !== "number"
    );


  if(
    semCoordenadas.length === 0
  ){

    return true;

  }


  lista.innerHTML = `

    <div class="progressoRota">

      📍 Localizando empresas...

      <br><br>

      Aguarde, não feche o aplicativo.

    </div>

  `;


  for(
    let i = 0;
    i < semCoordenadas.length;
    i++
  ){

    const empresa =
      semCoordenadas[i];


    lista.innerHTML = `

      <div class="progressoRota">

        📍 Localizando empresas...

        <br><br>

        ${i+1} de ${semCoordenadas.length}

        <br><br>

        🏢 ${empresa.nome}

      </div>

    `;


    try{

      const coordenadas =
        await obterCoordenadas(
          empresa.endereco,
          empresa.cidade
        );


      if(
        !coordenadas
      ){

        alert(

          "Não foi possível localizar:\n\n" +

          empresa.nome +

          "\n" +

          empresa.endereco +

          "\n\n" +

          "Verifique o endereço e tente novamente."

        );


        return false;

      }


      await updateDoc(

        doc(
          db,
          "empresas",
          empresa.id
        ),

        {

          latitude:
            coordenadas.latitude,

          longitude:
            coordenadas.longitude

        }

      );


      empresa.latitude =
        coordenadas.latitude;


      empresa.longitude =
        coordenadas.longitude;


    }catch(error){

      console.error(
        "Erro ao localizar empresa:",
        empresa.nome,
        error
      );


      alert(

        "Não foi possível localizar:\n\n" +

        empresa.nome +

        "\n\n" +

        "Verifique o endereço e tente novamente."

      );


      return false;

    }


    if(
      i <
      semCoordenadas.length - 1
    ){

      await esperar(1100);

    }

  }


  return true;

}

/* =========================================================

   ========================================================= */


novaEntrega.addEventListener(
  "click",
  async()=>{

    const confirmar =
      confirm(

        "⚠️ Iniciar nova entrega?\n\n" +

        "Todas as empresas voltarão para PENDENTE."

      );


    if(!confirmar)return;


    try{

      const consulta =
  collection(
    db,
    "empresas"
  );


      const resultado =
        await getDocs(
          consulta
        );


      for(
        const empresa
        of resultado.docs
      ){

        const dados =
          empresa.data();


        if(
          dados.obsoleta !== true
        ){

          await updateDoc(

            doc(
              db,
              "empresas",
              empresa.id
            ),

            {

              entregue:false

            }

          );

        }

      }


      filtroAtual =
        "pendentes";


      atualizarBotoesFiltro();


      await mostrarEmpresas();


      alert(

        "🔄 Nova entrega iniciada!\n\n" +

        "Todas as empresas estão pendentes."

      );


    }catch(error){

      console.error(
        error
      );


      alert(
        "Erro ao iniciar uma nova entrega."
      );

    }

  }
);


/* =========================================================
   PRÓXIMA ENTREGA POR DISTÂNCIA
   ========================================================= */


btnProximaEntrega.addEventListener(
  "click",
  async()=>{

    if(!usuarioAtual){

      alert(
        "Você precisa entrar primeiro."
      );

      return;

    }


    if(!cidade.value){

      alert(
        "Selecione uma cidade primeiro."
      );

      return;

    }


    try{

      const empresas =
        await buscarEmpresas();


      const pendentes =
        empresas.filter(
          empresa =>
            empresa.entregue !== true
        );


      if(
        pendentes.length === 0
      ){

        alert(
          "✅ Não há empresas pendentes nesta cidade."
        );

        return;

      }


      /*
        Obtém a localização atual.
      */

      lista.innerHTML = `

        <div class="progressoRota">

          📍 Obtendo sua localização...

          <br><br>

          Permita o acesso à localização quando o navegador pedir.

        </div>

      `;


      const minhaLocalizacao =
        await obterMinhaLocalizacao();


      /*
        Garante que todas as empresas
        tenham coordenadas.
      */

      const coordenadasOK =
        await garantirCoordenadas(
          pendentes
        );


      if(
        !coordenadasOK
      ){

        await mostrarEmpresas();

        return;

      }


      /*
        Calcula a distância de cada empresa.
      */

      /*
  Calcula a distância REAL pelas ruas
  entre sua localização e cada empresa.
*/

const empresasComDistancia = [];

const tamanhoLote = 50;

for(
  let inicio = 0;
  inicio < pendentes.length;
  inicio += tamanhoLote
){

  const lote =
    pendentes.slice(
      inicio,
      inicio + tamanhoLote
    );


  const coordenadas =
    [

      minhaLocalizacao.longitude +
      "," +
      minhaLocalizacao.latitude

    ].concat(

      lote.map(
        empresa =>
          empresa.longitude +
          "," +
          empresa.latitude
      )

    );


  const url =
    "https://router.project-osrm.org/table/v1/driving/" +
    coordenadas.join(";") +
    "?sources=0&annotations=distance";


  const resposta =
    await fetch(url);


  if(!resposta.ok){

    throw new Error(
      "Não foi possível calcular as distâncias pelas ruas."
    );

  }


  const dados =
    await resposta.json();


  if(
    !dados.distances ||
    !dados.distances[0]
  ){

    throw new Error(
      "O serviço de rotas não retornou as distâncias."
    );

  }


  const distancias =
    dados.distances[0];


  lote.forEach(
    (empresa,index)=>{

      const distanciaMetros =
        distancias[index + 1];


      if(
        typeof distanciaMetros === "number"
      ){

        empresasComDistancia.push({

          ...empresa,

          distanciaKm:
            distanciaMetros / 1000

        });

      }

    }
  );


  /*
    Pequena pausa entre os lotes.
  */

  if(
    inicio + tamanhoLote <
    pendentes.length
  ){

    await esperar(500);

  }

}


/*
  Ordena pela distância REAL
  pelas ruas.
*/

empresasComDistancia.sort(
  (a,b) =>
    a.distanciaKm -
    b.distanciaKm
);


const proxima =
  empresasComDistancia[0];


if(!proxima){

  throw new Error(
    "Não foi possível determinar a próxima empresa."
  );

}


const distancia =
  proxima.distanciaKm
    .toFixed(2);


      /*
        Mostra primeiro qual empresa foi escolhida.
      */

      lista.innerHTML = `

        <div class="progressoRota">

          📍 Próxima entrega encontrada

          <br><br>

          <strong>
            🏢 ${proxima.nome}
          </strong>

          <br><br>

          📏 Aproximadamente

          <strong>
            ${distancia} km
          </strong>

          de distância.

          <br><br>

          <span class="distanciaRota">
            📍 Distância calculada a partir da sua localização atual.
          </span>

        </div>

      `;


      await esperar(300);


      const destino =
        encodeURIComponent(

          proxima.endereco +
          ", " +
          proxima.cidade

        );


      const url =

        "https://www.google.com/maps/dir/?api=1" +

        "&destination=" +

        destino +

        "&travelmode=driving";


      lista.innerHTML += `

        <br>

        <button
          id="abrirGoogleMaps"
          style="
            background:#0d6efd;
            color:white;
            border:none;
            padding:14px 20px;
            border-radius:10px;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
          "
        >

          🗺️ Abrir rota no Google Maps

        </button>

      `;


      const botaoMapa =
        document.getElementById(
          "abrirGoogleMaps"
        );


      botaoMapa.addEventListener(
        "click",
        ()=>{

          window.open(
            url,
            "_blank"
          );

        }
      );


    }catch(error){

      console.error(
        "Erro na rota:",
        error
      );


      alert(
        error.message ||
        "Não foi possível calcular a próxima entrega."
      );


      await mostrarEmpresas();

    }

  }
);

onAuthStateChanged(
  auth,
  async function(usuario){

    if(usuario){

      usuarioAtual =
        usuario;


      try{

        const usuarioRef =
          doc(
            db,
            "usuarios",
            usuario.uid
          );


        const resultado =
          await getDoc(
            usuarioRef
          );


        // Se for o primeiro acesso,
        // cria automaticamente como usuário comum
        if(!resultado.exists()){

          await setDoc(
            usuarioRef,
            {
              tipo:"usuario",
              criadoEm:serverTimestamp()
            }
          );

        }


      }catch(error){

        console.error(
          "Erro ao verificar usuário:",
          error
        );

        alert(
          "Não foi possível carregar o cadastro do usuário."
        );

        return;

      }


      loginTela.style.display =
        "none";


      appTela.style.display =
        "block";


      usuarioEmail.textContent =
        "👤 " +
        usuario.email;


      await carregarCidades();


    }else{

      usuarioAtual =
        null;


      appTela.style.display =
        "none";


      loginTela.style.display =
        "flex";

    }

  }
);
