<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>STI — Rota do Jornal</title>
    <link rel="manifest" href="manifest.json">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .app {
            max-width: 600px;
            margin: auto;
            min-height: 100vh;
            background: white;
            display: none;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 22px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
            color: #d1d5db;
        }

        .conteudo {
            padding: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input,
        button {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 16px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .cidadeLinha {
            display: flex;
            gap: 8px;
        }

        .cidadeLinha select {
            flex: 1;
        }

        .cidadeLinha button {
            width: auto;
            white-space: nowrap;
            background: #16a34a;
        }

        .cidadeLinha button:hover {
            background: #15803d;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .resumo {
            margin: 20px 0;
            padding: 15px;
            background: #eef2ff;
            border-radius: 10px;
        }

        .resumo strong {
            font-size: 18px;
        }

        .estatisticas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .estatistica {
            padding: 13px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .estatistica .titulo {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .estatistica .numero {
            font-size: 21px;
            font-weight: bold;
        }

        .filtrosStatus {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filtroStatus {
            background: #e5e7eb;
            color: #374151;
        }

        .filtroStatus.ativo {
            background: #2563eb;
            color: white;
        }

        .badge {
            display: inline-block;
            margin-left: 5px;
            background: rgba(255,255,255,0.25);
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 13px;
        }

        .filtroStatus:not(.ativo) .badge {
            background: #d1d5db;
        }

        .empresa {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .empresa h3 {
            margin: 0 0 7px;
        }

        .endereco {
            color: #666;
            margin-bottom: 10px;
        }

        .informacoes {
            margin-bottom: 10px;
            font-size: 15px;
        }

        .informacoes div {
            margin-bottom: 4px;
        }

        .status {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .statusPendente {
            color: #dc2626;
        }

        .statusEntregue {
            color: #16a34a;
        }

        .acoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .mapa {
            background: #16a34a;
        }

        .mapa:hover {
            background: #15803d;
        }

        .entregar {
            background: #2563eb;
        }

        .pendenteNovamente {
            background: #f59e0b;
        }

        .editar {
            background: #2563eb;
        }

        .excluir {
            background: #dc2626;
        }

        .excluir:hover {
            background: #b91c1c;
        }

        .carregando {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .vazio {
            text-align: center;
            color: #777;
            padding: 30px 10px;
        }

        #loginTela {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .loginCaixa {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .loginCaixa h1 {
            margin-top: 0;
        }

        .loginCaixa p {
            color: #666;
            margin-bottom: 25px;
        }

        #entrarGoogle {
            background: #2563eb;
        }

        #usuarioArea {
            margin-top: 12px;
            font-size: 14px;
            color: #d1d5db;
        }

        #sair {
            margin-top: 10px;
            width: auto;
            padding: 8px 14px;
            font-size: 14px;
            background: #374151;
        }

        #mensagem {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
        }

        /* TELA OBSOLETAS */

        .fundoObsoletas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            z-index: 9999;
            overflow-y: auto;
            padding: 20px;
        }

        .caixaObsoletas {
            background: #fff;
            max-width: 700px;
            margin: 20px auto;
            border-radius: 15px;
            padding: 20px;
        }

        .cardObsoleta {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .cardObsoleta h3 {
            margin-top: 0;
        }

        .botoesObsoleta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .restaurar {
            background: #16a34a;
        }

        .excluirDefinitivo {
            background: #dc2626;
        }

        .fecharObsoletas {
            background: #555;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {

            .filtrosStatus {
                grid-template-columns: 1fr;
            }

            .acoes {
                grid-template-columns: 1fr 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginTela">

    <div class="loginCaixa">

        <h1>
            📰 STI — Rota do Jornal
        </h1>

        <p>
            Entre com sua conta Google para acessar suas entregas.
        </p>

        <button id="entrarGoogle">
            🔐 Entrar com Google
        </button>

        <div id="mensagem"></div>

    </div>

</div>


<!-- =====================================================
     APLICATIVO
===================================================== -->

<div class="app">

    <header>

        <h1>
            📰 STI — Rota do Jornal
        </h1>

        <p>
            Organizador das suas entregas
        </p>

        <div id="usuarioArea">

            <span id="usuarioEmail"></span>

            <br>

            <button id="sair">
                Sair
            </button>

        </div>

    </header>


    <div class="conteudo">


        <!-- CIDADE -->

        <div class="campo">

            <label for="cidade">
                Cidade
            </label>

            <div class="cidadeLinha">

                <select id="cidade"></select>

                <button id="adicionarCidade">
                    + Cidade
                </button>

            </div>

        </div>


        <!-- CADASTRAR -->

        <button id="adicionar">

        </button>


        <!-- RESUMO -->

        <div class="resumo">

            <strong id="tituloRota">
                Salto
            </strong>

            <br>

            <span id="contador">

            </span>

        </div>


        <!-- ESTATÍSTICAS -->

        <div class="estatisticas">

            <div class="estatistica">

                <div class="titulo">
                    🏢 Total de empresas
                </div>

                <div
                    class="numero"
                    id="totalEmpresas"
                >
                    0
                </div>

            </div>


            <div class="estatistica">

                <div class="titulo">
                    👥 Total funcionários
                </div>

                <div
                    class="numero"
                    id="totalFuncionarios"
                >
                    0
                </div>

            </div>


            <div class="estatistica">

                <div class="titulo">
                    📰 Jornais entregues
                </div>

                <div
                    class="numero"
                    id="jornaisEntregues"
                >
                    0
                </div>

            </div>


            <div class="estatistica">

                <div class="titulo">
                    📰 Jornais faltando
                </div>

                <div
                    class="numero"
                    id="jornaisFaltando"
                >
                    0
                </div>

            </div>

        </div>


        <!-- FILTROS -->

        <div class="filtrosStatus">

            <button
                id="btnPendentes"
                class="filtroStatus ativo"
            >
                🔴 Pendentes

                <span
                    id="badgePendentes"
                    class="badge"
                >
                    0
                </span>

            </button>


            <button
                id="btnEntregues"
                class="filtroStatus"
            >
                🟢 Entregues

                <span
                    id="badgeEntregues"
                    class="badge"
                >
                    0
                </span>

            </button>


            <button
                id="novaEntrega"
                class="filtroStatus"
            >
                🔄 Nova entrega
            </button>


            <button
                id="btnProximaEntrega"
                class="filtroStatus"
            >
                🗺️ Próxima entrega
            </button>


            <button
                id="btnObsoletas"
                class="filtroStatus"
            >
                🚫 Obsoletas
            </button>

        </div>


        <!-- LISTA -->

        <div id="lista">

            <div class="carregando">
                Carregando empresas...
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


    /* =====================================================
       IMPORTS
    ===================================================== */

    import {
        initializeApp
    } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        deleteDoc,
        doc,
        query,
        where,
        serverTimestamp,
        getDoc,
        setDoc
    } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* =====================================================
       FIREBASE CONFIG
    ===================================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCD_pBQlMyrPucvK7ruSRM0wFiKmRHkrlc",

        authDomain:
            "meuappentregas-8829f.firebaseapp.com",

        projectId:
            "meuappentregas-8829f",

        storageBucket:
            "meuappentregas-8829f.firebasestorage.app",

        messagingSenderId:
            "812561892421",

        appId:
            "1:812561892421:web:ffc5c628a15a36c8384f2c"

    };


    /* =====================================================
       INICIAR FIREBASE
    ===================================================== */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const provider =
        new GoogleAuthProvider();


    const db =
        getFirestore(app);


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const loginTela =
        document.getElementById("loginTela");

    const entrarGoogle =
        document.getElementById("entrarGoogle");

    const mensagem =
        document.getElementById("mensagem");

    const appTela =
        document.querySelector(".app");

    const usuarioEmail =
        document.getElementById("usuarioEmail");

    const sair =
        document.getElementById("sair");

    const cidade =
        document.getElementById("cidade");

    const lista =
        document.getElementById("lista");

    const contador =
        document.getElementById("contador");

    const tituloRota =
        document.getElementById("tituloRota");

    const adicionar =
        document.getElementById("adicionar");

    const adicionarCidade =
        document.getElementById("adicionarCidade");

    const btnPendentes =
        document.getElementById("btnPendentes");

    const btnEntregues =
        document.getElementById("btnEntregues");

    const novaEntrega =
        document.getElementById("novaEntrega");

    const btnProximaEntrega =
        document.getElementById("btnProximaEntrega");

    const btnObsoletas =
        document.getElementById("btnObsoletas");

    const badgePendentes =
        document.getElementById("badgePendentes");

    const badgeEntregues =
        document.getElementById("badgeEntregues");

    const totalEmpresas =
        document.getElementById("totalEmpresas");

    const totalFuncionarios =
        document.getElementById("totalFuncionarios");

    const jornaisEntregues =
        document.getElementById("jornaisEntregues");

    const jornaisFaltando =
        document.getElementById("jornaisFaltando");


    /* =====================================================
       VARIÁVEIS
    ===================================================== */

    let usuarioAtual = null;

    let filtroAtual = "pendentes";


    const cidadesIniciais = [
        "Salto",
        "Itu",
        "Indaiatuba"
    ];


    /* =====================================================
       MENSAGEM
    ===================================================== */

    function mostrarMensagem(texto) {

        mensagem.textContent =
            texto;

        mensagem.style.display =
            "block";

    }


    /* =====================================================
       LOGIN GOOGLE
    ===================================================== */

    entrarGoogle.addEventListener(
        "click",
        async function() {

            mensagem.style.display =
                "none";

            try {

                await signInWithPopup(
                    auth,
                    provider
                );

            } catch (error) {

                console.error(
                    "Erro no login:",
                    error
                );

                mostrarMensagem(
                    "Não foi possível entrar com Google."
                );

            }

        }
    );


    /* =====================================================
       SAIR
    ===================================================== */

    sair.addEventListener(
        "click",
        async function() {

            try {

                await signOut(auth);

            } catch (error) {

                console.error(
                    "Erro ao sair:",
                    error
                );

            }

        }
    );


    /* =====================================================
       CARREGAR CIDADES
    ===================================================== */

    async function carregarCidades() {

        if (!usuarioAtual) {
            return;
        }

        try {

            const usuarioRef =
                doc(
                    db,
                    "usuarios",
                    usuarioAtual.uid
                );


    const resultado =
                await getDoc(
                    usuarioRef
                );


    let cidades;


    if (resultado.exists()) {

        const dados =
            resultado.data();


        cidades =
            Array.isArray(dados.cidades)
                && dados.cidades.length > 0
                ? dados.cidades
                : [...cidadesIniciais];

    } else {

        cidades =
            [...cidadesIniciais];


        await setDoc(
            usuarioRef,
            {
                cidades:
                    cidades,

                criadoEm:
                    serverTimestamp()
            }
        );

    }


    cidade.innerHTML =
        "";


    cidades.forEach(
        function(nomeCidade) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                nomeCidade;

            option.textContent =
                nomeCidade;

            cidade.appendChild(
                option
            );

        }
    );


    await mostrarEmpresas();


        } catch (error) {

            console.error(
                "Erro ao carregar cidades:",
                error
            );

            lista.innerHTML = `
                <div class="vazio">
                    ⚠️ Não foi possível carregar as cidades.
                </div>
            `;

        }

    }


    /* =====================================================
       ADICIONAR CIDADE
    ===================================================== */

    adicionarCidade.addEventListener(
        "click",
        async function() {

            if (!usuarioAtual) {

                alert(
                    "Você precisa entrar primeiro."
                );

                return;

            }


            const novaCidade =
                prompt(
                    "Digite o nome da nova cidade:"
                );


            if (!novaCidade) {
                return;
            }


            const nome =
                novaCidade.trim();


            if (!nome) {
                return;
            }


            try {

                const usuarioRef =
                    doc(
                        db,
                        "usuarios",
                        usuarioAtual.uid
                    );


            const resultado =
                await getDoc(
                    usuarioRef
                );


            let cidades;


            if (resultado.exists()) {

                const dados =
                    resultado.data();


                cidades =
                    Array.isArray(dados.cidades)
                        ? [...dados.cidades]
                        : [...cidadesIniciais];

            } else {

                cidades =
                    [...cidadesIniciais];

            }


            const existe =
                cidades.some(
                    function(cidadeExistente) {

                        return (
                            cidadeExistente.toLowerCase()
                            ===
                            nome.toLowerCase()
                        );

                    }
                );


            if (existe) {

                alert(
                    "Essa cidade já está cadastrada."
                );

                return;

            }


            cidades.push(nome);


            await setDoc(
                usuarioRef,
                {
                    cidades:
                        cidades
                },
                {
                    merge:
                        true
                }
            );


            cidade.innerHTML =
                "";


            cidades.forEach(
                function(nomeCidade) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        nomeCidade;

                    option.textContent =
                        nomeCidade;

                    cidade.appendChild(
                        option
                    );

                }
            );


            cidade.value =
                nome;


            filtroAtual =
                "pendentes";


            atualizarBotoesFiltro();


            await mostrarEmpresas();


            } catch (error) {

                console.error(
                    "Erro ao adicionar cidade:",
                    error
                );

                alert(
                    "Não foi possível salvar a nova cidade."
                );

            }

        }
    );


    /* =====================================================
       LOGIN / LOGOUT
    ===================================================== */

    onAuthStateChanged(
        auth,
        async function(user) {

            if (user) {

                usuarioAtual =
                    user;


                loginTela.style.display =
                    "none";


                appTela.style.display =
                    "block";


                usuarioEmail.textContent =
                    "👤 " +
                    user.email;


                await carregarCidades();


            } else {

                usuarioAtual =
                    null;


                appTela.style.display =
                    "none";


                loginTela.style.display =
                    "flex";


                lista.innerHTML =
                    "";

            }

        }
    );


    /* =====================================================
       BUSCAR EMPRESAS NORMAIS
    ===================================================== */

    async function buscarEmpresas() {

        if (!usuarioAtual) {
            return [];
        }


        const consulta =
            query(
                collection(
                    db,
                    "empresas"
                ),

                where(
                    "uid",
                    "==",
                    usuarioAtual.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        const empresas = [];


        resultado.forEach(
            function(documento) {

                const dados =
                    documento.data();


                if (
                    dados.cidade !== cidade.value
                ) {
                    return;
                }


                if (
                    dados.obsoleta === true
                ) {
                    return;
                }


                empresas.push({

                    id:
                        documento.id,

                    ...dados,

                    funcionarios:
                        Number(
                            dados.funcionarios
                        ) || 0,

                    jornais:
                        Number(
                            dados.jornais
                        ) || 0

                });

            }
        );


        return empresas;

    }


    /* =====================================================
       MOSTRAR EMPRESAS
    ===================================================== */

    async function mostrarEmpresas() {

        if (!usuarioAtual) {
            return;
        }


        lista.innerHTML = `
            <div class="carregando">
                Carregando empresas...
            </div>
        `;


        const cidadeSelecionada =
            cidade.value;


        tituloRota.textContent =
            cidadeSelecionada;


        try {

            const empresas =
                await buscarEmpresas();


            const pendentes =
                empresas.filter(
                    function(empresa) {

                        return (
                            empresa.entregue !== true
                        );

                    }
                );


            const entregues =
                empresas.filter(
                    function(empresa) {

                        return (
                            empresa.entregue === true
                        );

                    }
                );


            /* TOTAIS */

            let funcionariosTotal = 0;

            let jornaisEntreguesTotal = 0;

            let jornaisPendentesTotal = 0;


            empresas.forEach(
                function(empresa) {

                    funcionariosTotal +=
                        empresa.funcionarios;

                    if (
                        empresa.entregue === true
                    ) {

                        jornaisEntreguesTotal +=
                            empresa.jornais;

                    } else {

                        jornaisPendentesTotal +=
                            empresa.jornais;

                    }

                }
            );


            totalEmpresas.textContent =
                empresas.length;


            totalFuncionarios.textContent =
                funcionariosTotal;


            jornaisEntregues.textContent =
                jornaisEntreguesTotal;


            jornaisFaltando.textContent =
                jornaisPendentesTotal;


            badgePendentes.textContent =
                pendentes.length;


            badgeEntregues.textContent =
                entregues.length;


            /* CONTADOR */

            if (
                filtroAtual === "pendentes"
            ) {

                contador.textContent =
                    pendentes.length === 1
                        ? "1 empresa faltando"
                        : pendentes.length +
                          " empresas faltando";

            } else {

                contador.textContent =
                    entregues.length === 1
                        ? "1 empresa entregue"
                        : entregues.length +
                          " empresas entregues";

            }


            const empresasMostrar =
                filtroAtual === "pendentes"
                    ? pendentes
                    : entregues;


            lista.innerHTML =
                "";


            if (
                empresasMostrar.length === 0
            ) {

                if (
                    filtroAtual === "pendentes"
                ) {

                    lista.innerHTML = `
                        <div class="vazio">
                            ✅ Nenhuma empresa pendente.
                            <br><br>
                            Todas as entregas foram concluídas.
                        </div>
                    `;

                } else {

                    lista.innerHTML = `
                        <div class="vazio">
                            📭 Nenhuma empresa entregue ainda.
                        </div>
                    `;

                }


                return;

            }


            /* =================================================
               CARDS
            ================================================= */

            empresasMostrar.forEach(
                function(empresa) {

                    const div =

    const funcionarios =

    /* =====================================================
       MOSTRAR EMPRESAS OBSOLETAS
    ===================================================== */

    async function mostrarEmpresasObsoletas() {

        if (!usuarioAtual) {
            return;
        }


        try {

            const consulta =
                query(
                    collection(
                        db,
                        "empresas"
                    ),

                    where(
                        "uid",
                        "==",
                        usuarioAtual.uid
                    )
                );


        const resultado =
            await getDocs(
                consulta
            );


        const obsoletas = [];


        resultado.forEach(
            function(documento) {

                const dados =
                    documento.data();


                if (
                    dados.obsoleta === true
                    &&
                    dados.cidade === cidade.value
                ) {

                    obsoletas.push({

                        id:
                            documento.id,

                        ...dados,

                        funcionarios:
                            Number(
                                dados.funcionarios
                            ) || 0,

                        jornais:
                            Number(
                                dados.jornais
                            ) || 0

                    });

            }
        );


        const fundo =
            document.createElement(
                "div"

            document.createElement(
                "div"

            "caixaObsoletas";

            document.createElement(

            function() {

                fundo.remove();

            botaoFechar

            "📭 Nenhuma empresa obsoleta nesta cidade.";

            vazio

        /* EMPRESAS */

        obsoletas.forEach(
            function(empresa) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "cardObsoleta";


                const nome =
                    document.createElement(
                        "h3"
                    );


                nome.textContent =
                    "🏢 " +
                    (empresa.nome || "");


                const endereco =
                    document.createElement(
                        "div"
                    );


                endereco.textContent =
                    "📍 " +
                    (empresa.endereco || "");


                const cidadeTexto =
                    document.createElement(
                        "div"
                    );


                cidadeTexto.textContent =
                    "🏙️ " +
                    (empresa.cidade || "");


                const funcionarios =
                    document.createElement(
                        "div"
                    );


                funcionarios.textContent =
                    "👥 " +
                    (empresa.funcionarios || 0) +
                    " funcionários";


                const jornais =
                    document.createElement(
                        "div"
                    );


                jornais.textContent =
                    "📰 " +
                    (empresa.jornais || 0) +
                    " jornais";


                card.appendChild(
                    nome
                );


                card.appendChild(
                    endereco
                );


                card.appendChild(
                    cidadeTexto
                );


                card.appendChild(
                    funcionarios
                );


                card.appendChild(
                    jornais
                );


                /* BOTÕES */

                const botoes =
                    document.createElement(
                        "div"
                    );


                botoes.className =
                    "botoesObsoleta";


                /* RESTAURAR */

                const botaoRestaurar =
                    document.createElement(
                        "button"
                    );


                botaoRestaurar.className =
                    "restaurar";


                botaoRestaurar.textContent =
                    "♻️ Restaurar";


                botaoRestaurar.addEventListener(
                    "click",
                    async function() {

                        await restaurarEmpresa(
                            empresa.id

                    }

                /* EXCLUIR DEFINITIVAMENTE */

                const botaoExcluir =
                    document.createElement(
                        "button"
                    );


                botaoExcluir.className =
                    "excluirDefinitivo";


                botaoExcluir.textContent =
                    "🗑️ Excluir definitivamente";


                botaoExcluir.addEventListener(
                    "click",
                    async function() {

                        await excluirEmpresaDefinitivamente(

                botoes.appendChild(
                    botaoRestaurar
                );


                botoes.appendChild(
                    botaoExcluir
                );


                card.appendChild(
                    botoes

                caixa.appendChild(

        fundo.appendChild(

        document.body.appendChild(

    ===================================================== */

    novaEntrega.addEventListener(
        "click",
        async function() {

            const cidadeAtual =
                cidade.value;


            if (!cidadeAtual) {

                alert(
                    "Selecione uma cidade primeiro."
                );

                return;

            }


            const confirmar =
                confirm(
                    "🔄 Iniciar uma nova entrega em " +
                    cidadeAtual +
                    "?\n\nTodas as empresas normais desta cidade serão marcadas como PENDENTES."
                );


            if (!confirmar) {
                return;
            }


            try {

                const consulta =
                    query(
                        collection(
                            db,
                            "empresas"
                        ),

                        where(
                            "uid",
                            "==",
                            usuarioAtual.uid
                        )
                    );


                const resultado =
                    await getDocs(
                        consulta
                    );


                for (
                    const empresa
                    of resultado.docs
                ) {

                    const dados =
                        empresa.data();


                    if (
                        dados.cidade === cidadeAtual
                        &&
                        dados.obsoleta !== true
                    ) {

                        await updateDoc(
                            doc(
                                db,
                                "empresas",
                                empresa.id
                            ),
                            {

                                entregue:
                                    false

                            }
                        );

                    }

                }


                filtroAtual =
                    "pendentes";


                atualizarBotoesFiltro();


                await mostrarEmpresas();


                alert(
                    "🔄 Nova entrega iniciada!\n\nTodas as empresas estão pendentes."
                );


            } catch (erro) {

                console.error(
                    erro
                );


                alert(

                );

            }

        }
    );

            try {

                const empresas =

            const pendentes =
                empresas.filter(
                    function(empresa) {

            if (pendentes.length === 0) {

                alert(

            const proxima =
                pendentes[0];


            const destino =

                    proxima.endereco +

    /* =====================================================

    ===================================================== */

    async function buscarEmpresas() {

        if (!usuarioAtual) {
            return [];
        }

        const empresasRef =
            collection(
                db,
                "empresas"
            );

        const consulta =
            query(
                empresasRef,
                where(
                    "uid",
                    "==",
                    usuarioAtual.uid
                ),
                where(
                    "cidade",
                    "==",
                    cidade.value
                )
            );

        const snapshot =
            await getDocs(
                consulta
            );

        const empresas = [];

        snapshot.forEach(
            function(docSnap) {

                const empresa =
                    docSnap.data();

                if (
                    empresa.obsoleta !== true
                ) {

                    empresas.push({

                        id:
                            docSnap.id,

                        ...empresa

                    });

                }

            }
        );

        empresas.sort(
            function(a, b) {

                return (
                    (a.ordem || 0) -
                    (b.ordem || 0)
                );

            }
        );

        return empresas;

    }

        async function() {

            const cidadeAtual =
                cidade.value;


            if (!cidadeAtual) {

                alert(
                    "Selecione uma cidade primeiro."
                );

                return;

            }


            const confirmar =
                confirm(
                    "🔄 Iniciar uma nova entrega em " +
                    cidadeAtual +
                    "?\n\nTodas as empresas normais desta cidade serão marcadas como PENDENTES."
                );


            if (!confirmar) {
                return;
            }


            try {

                const consulta =
                    query(
                        collection(
                            db,
                            "empresas"
                        ),

                        where(
                            "uid",
                            "==",
                            usuarioAtual.uid
                        )
                    );


                const resultado =
                    await getDocs(
                        consulta
                    );


                for (
                    const empresa
                    of resultado.docs
                ) {

                    const dados =
                        empresa.data();


                    if (
                        dados.cidade === cidadeAtual
                        &&
                        dados.obsoleta !== true
                    ) {

                        await updateDoc(
                            doc(
                                db,
                                "empresas",
                                empresa.id
                            ),
                            {

                                entregue:
                                    false

                            }
                        );

                    }

                }


                filtroAtual =
                    "pendentes";


                atualizarBotoesFiltro();


                await mostrarEmpresas();


                alert(
                    "🔄 Nova entrega iniciada!\n\nTodas as empresas estão pendentes."
                );


            } catch (erro) {

                console.error(
                    erro
                );


                alert(
                    "Erro ao iniciar uma nova entrega."
                );

            }

        }
    );


    /* =====================================================
       PRÓXIMA ENTREGA
    ===================================================== */

    btnProximaEntrega.addEventListener(
        "click",
        async function() {

            if (!usuarioAtual) {

                alert(
                    "Você precisa entrar primeiro."
                );

                return;

            }


            const cidadeAtual =
                cidade.value;


            if (!cidadeAtual) {

                alert(
                    "Selecione uma cidade primeiro."
                );

                return;

            }


            try {

                const empresas =
                    await buscarEmpresas();


                const pendentes =
                    empresas.filter(
                        function(empresa) {

                            return (
                                empresa.entregue !== true
                            );

                        }
                    );


                if (pendentes.length === 0) {

                    alert(
                        "✅ Não há empresas pendentes nesta cidade."
                    );

                    return;

                }


                const proxima =
                    pendentes[0];


                const destino =
                    encodeURIComponent(
                        proxima.endereco +
                        ", " +
                        proxima.cidade
                    );


                window.open(

                    "https://www.google.com/maps/search/?api=1&query=" +
                    destino,

                    "_blank"

                );

            } catch (error) {

                console.error(
                    "Erro ao buscar próxima entrega:",
                    error
                );


                alert(
                    "Não foi possível encontrar a próxima entrega."
                );

            }

        }
    );


    /* =====================================================
       MUDANÇA DE CIDADE
    ===================================================== */

    cidade.addEventListener(
        "change",
        async function() {

            filtroAtual =
                "pendentes";


            atualizarBotoesFiltro();


            await mostrarEmpresas();

        }
    );


    /* =====================================================
       BOTÃO OBSOLETAS
    ===================================================== */

    btnObsoletas.addEventListener(
        "click",
        async function() {

            await mostrarEmpresasObsoletas();

        }
    );


</script>
