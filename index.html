<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  display:none;
}

header{
  background:#1f2937;
  color:#fff;
  padding:22px 20px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  color:#d1d5db;
}

.conteudo{
  padding:20px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

select,
input,
button{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:16px;
}

button{
  background:#2563eb;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.campo{
  margin-bottom:18px;
}

.cidadeLinha{
  display:flex;
  gap:8px;
}

.cidadeLinha select{
  flex:1;
}

.cidadeLinha button{
  width:auto;
  white-space:nowrap;
  background:#16a34a;
}

.resumo{
  margin:20px 0;
  padding:15px;
  background:#eef2ff;
  border-radius:10px;
}

.resumo strong{
  font-size:18px;
}

.estatisticas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.estatistica{
  padding:13px;
  border-radius:10px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
}

.estatistica .titulo{
  font-size:13px;
  color:#64748b;
  margin-bottom:5px;
}

.estatistica .numero{
  font-size:21px;
  font-weight:bold;
}

.filtrosStatus{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}

.filtroStatus{
  background:#e5e7eb;
  color:#374151;
}

.filtroStatus.ativo{
  background:#2563eb;
  color:#fff;
}

.badge{
  display:inline-block;
  margin-left:5px;
  background:rgba(255,255,255,.25);
  padding:2px 7px;
  border-radius:20px;
  font-size:13px;
}

.filtroStatus:not(.ativo) .badge{
  background:#d1d5db;
}

.gerenciarEntrega{
  grid-column:1 / -1;
}

.gerenciarEntrega summary{
  list-style:none;
  background:#e5e7eb;
  color:#374151;
  padding:13px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
}

.gerenciarEntrega summary::-webkit-details-marker{
  display:none;
}

.gerenciarEntrega[open] summary{
  background:#2563eb;
  color:#fff;
}

.gerenciarEntrega button{
  margin-top:8px;
}

.empresa{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-bottom:12px;
}

.empresa h3{
  margin:0 0 7px;
}

.endereco{
  color:#666;
  margin-bottom:10px;
}

.informacoes{
  margin-bottom:10px;
  font-size:15px;
}

.informacoes div{
  margin-bottom:4px;
}

.status{
  font-weight:bold;
  margin-bottom:10px;
}

.statusPendente{
  color:#dc2626;
}

.statusEntregue{
  color:#16a34a;
}

.acoes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.mapa{
  background:#16a34a;
}

.mapa:hover{
  background:#15803d;
}

.entregar{
  background:#2563eb;
}

.pendenteNovamente{
  background:#f59e0b;
}

.editar{
  background:#2563eb;
}

.usuarioComum .soAdmin{
  display:none !important;
}

.excluir{
  background:#dc2626;
}

.excluir:hover{
  background:#b91c1c;
}

.carregando{
  text-align:center;
  padding:30px;
  color:#666;
}

.vazio{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

#loginTela{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginCaixa{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:30px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  text-align:center;
}

.loginCaixa h1{
  margin-top:0;
}

.loginCaixa p{
  color:#666;
  margin-bottom:25px;
}

#entrarGoogle{
  background:#2563eb;
}

#usuarioArea{
  margin-top:12px;
  font-size:14px;
  color:#d1d5db;
}

#sair{
  margin-top:10px;
  width:auto;
  padding:8px 14px;
  font-size:14px;
  background:#374151;
}

#mensagem{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  background:#fee2e2;
  color:#991b1b;
  font-size:14px;
}

.fundoObsoletas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.65);
  z-index:9999;
  overflow-y:auto;
  padding:20px;
}

.caixaObsoletas{
  background:#fff;
  max-width:700px;
  margin:20px auto;
  border-radius:15px;
  padding:20px;
}

.cardObsoleta{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-bottom:15px;
}

.cardObsoleta h3{
  margin-top:0;
}

.botoesObsoleta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.restaurar{
  background:#16a34a;
}

.excluirDefinitivo{
  background:#dc2626;
}

.fecharObsoletas{
  background:#555;
  margin-bottom:20px;
}

.progressoRota{
  background:#eef2ff;
  padding:15px;
  border-radius:10px;
  text-align:center;
  margin-bottom:15px;
}

.distanciaRota{
  font-size:15px;
  color:#374151;
  margin-top:8px;
}

@media(max-width:500px){

  .filtrosStatus{
    grid-template-columns:1fr;
  }

  .acoes{
    grid-template-columns:1fr 1fr;
  }

}
</style>
</head>

        resultado.data();

    if(!cidades){

      cidades =
        [...cidadesIniciais];


      /*

    collection(
      db,
      "empresas"
    );

    await getDocs(consulta);

    documento=>{

      const dados =
        documento.data();

        dados.cidade !==
        cidade.value
      ){

      }

        dados.obsoleta === true
      ){

      }


      empresas.push({

          documento.id,

        ...dados,

        funcionarios:
          Number(dados.funcionarios)||0,

        jornais:
          Number(dados.jornais)||0

      });

    }
  );


  return empresas;

}

function esperar(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/*
  Localiza o endereço da empresa.

  Faz três tentativas diferentes para aumentar
  a chance de encontrar endereços que o Nominatim
  não reconheça na primeira consulta.
*/

async function obterCoordenadas(
  endereco,
  cidadeNome
){

  const consultas = [

    endereco +
      ", " +
      cidadeNome +
      ", São Paulo, Brasil",

    endereco +
      ", " +
      cidadeNome +
      ", Brasil",

    endereco.replace(/\s*-\s*.*$/, "") +
      ", " +
      cidadeNome +
      ", São Paulo, Brasil"

  ];


  for(
    const consultaTexto of consultas
  ){

    try{

      const consulta =
        encodeURIComponent(
          consultaTexto
        );


      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&limit=1" +
        "&countrycodes=br" +
        "&q=" +
        consulta;


      const resposta =
        await fetch(url);


      if(!resposta.ok){

        continue;

      }


      const dados =
        await resposta.json();


      if(dados.length){

        return {

          latitude:
            Number(
              dados[0].lat
            ),

          longitude:
            Number(
              dados[0].lon
            )

        };

      }

    }catch(error){

      console.error(
        "Tentativa de localização falhou:",
        consultaTexto,
        error
      );

    }

  }


  return null;

}


/*
  Obtém a localização atual do aparelho.

  maximumAge:0
  obriga o navegador a tentar obter
  uma localização atual.

  enableHighAccuracy:true
  solicita a maior precisão disponível.
*/

function obterMinhaLocalizacao(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "Seu navegador não possui localização."
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        posicao=>{

          resolve({

            latitude:
              posicao.coords.latitude,

            longitude:
              posicao.coords.longitude

          });

        },


        erro=>{

          let mensagemErro =
            "Não foi possível obter sua localização.";


          if(
            erro.code === 1
          ){

            mensagemErro =
              "Permissão de localização negada. Ative a localização do navegador.";

          }


          if(
            erro.code === 2
          ){

            mensagemErro =
              "Não foi possível determinar sua localização.";

          }


          if(
            erro.code === 3
          ){

            mensagemErro =
              "O GPS demorou demais para responder.";

          }


          reject(
            new Error(
              mensagemErro
            )
          );

        },


        {

          enableHighAccuracy:true,

          timeout:30000,

          maximumAge:0

        }

      );

    }
  );

}


/*
  Calcula a distância em linha reta
  entre dois pontos usando a fórmula
  de Haversine.
*/

function calcularDistanciaKm(
  lat1,
  lon1,
  lat2,
  lon2
){

  const raioTerra =
    6371;


  const dLat =
    (lat2-lat1) *
    Math.PI /
    180;


  const dLon =
    (lon2-lon1) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2)

    +

    Math.cos(
      lat1 *
      Math.PI /
      180
    )

    *

    Math.cos(
      lat2 *
      Math.PI /
      180
    )

    *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  return raioTerra * c;

}


/*
  Garante que todas as empresas pendentes
  possuam latitude e longitude.

  Se uma empresa não possuir coordenadas,
  o aplicativo tenta localizá-la novamente.
*/

async function garantirCoordenadas(
  empresas
){

  const semCoordenadas =
    empresas.filter(
      empresa =>
        typeof empresa.latitude !== "number"
        ||
        typeof empresa.longitude !== "number"
    );


  if(
    semCoordenadas.length === 0
  ){

    return true;

  }


  lista.innerHTML = `

    <div class="progressoRota">

      📍 Localizando empresas...

      <br><br>

      Aguarde, não feche o aplicativo.

    </div>

  `;


  for(
    let i = 0;
    i < semCoordenadas.length;
    i++
  ){

    const empresa =
      semCoordenadas[i];


    lista.innerHTML = `

      <div class="progressoRota">

        📍 Localizando empresas...

        <br><br>

        ${i+1} de ${semCoordenadas.length}

        <br><br>

        🏢 ${empresa.nome}

      </div>

    `;


    try{

      const coordenadas =
        await obterCoordenadas(
          empresa.endereco,
          empresa.cidade
        );


      if(
        !coordenadas
      ){

        alert(

          "Não foi possível localizar:\n\n" +

          empresa.nome +

          "\n" +

          empresa.endereco +

          "\n\n" +

          "Verifique o endereço e tente novamente."

        );


        return false;

      }


      /*
        Salvar as coordenadas no Firestore só é
        permitido ao administrador. Para o usuário
        comum, a coordenada é usada apenas nesta
        consulta, sem gravar.
      */

      try{

        await updateDoc(

          doc(
            db,
            "empresas",
            empresa.id
          ),

          {

            latitude:
              coordenadas.latitude,

            longitude:
              coordenadas.longitude

          }

        );

      }catch(erroSalvar){

        console.warn(
          "Coordenadas não gravadas (sem permissão):",
          empresa.nome,
          erroSalvar
        );

      }


      empresa.latitude =
        coordenadas.latitude;


      empresa.longitude =
        coordenadas.longitude;


    }catch(error){

      console.error(
        "Erro ao localizar empresa:",
        empresa.nome,
        error
      );


      alert(

        "Não foi possível localizar:\n\n" +

        empresa.nome +

        "\n\n" +

        "Verifique o endereço e tente novamente."

      );


      return false;

    }


    if(
      i <
      semCoordenadas.length - 1
    ){

      await esperar(1100);

    }

  }


  return true;

}

          "cidades"

            empresasParaImportar.map(

          )

            )
        );

        );

      await mostrarEmpresas();

          funcionarios,

        jornais:
          jornais,

        entregue:
          false,

        obsoleta:
          false,

        uid:
          usuarioAtual.uid,

        criadoEm:
          serverTimestamp()

      };


      if(
        coordenadas
      ){

        dadosEmpresa.latitude =
          coordenadas.latitude;

        dadosEmpresa.longitude =
          coordenadas.longitude;

      }


      await addDoc(
        collection(
          db,
          "empresas"
        ),
        dadosEmpresa
      );


      filtroAtual =
        "pendentes";


      atualizarBotoesFiltro();


      await mostrarEmpresas();


      if(
        !coordenadas
      ){

        alert(

          "Empresa cadastrada.\n\n" +

          "⚠️ O endereço não pôde ser localizado agora.\n\n" +

          "A rota poderá tentar localizar esse endereço novamente."

        );

      }


    }catch(error){

      console.error(
        "Erro ao cadastrar:",
        error
      );


      alert(
        "Erro ao salvar a empresa no Firebase."
      );

    }

  }
);

/* =========================================================
   EDITAR EMPRESA
   ========================================================= */


async function editarEmpresa(
  empresa
){

  const nome =
    prompt(
      "Nome da empresa:",
      empresa.nome
    );


  if(
    nome === null
  ){

    return;

  }


  if(
    !nome.trim()
  ){

    alert(
      "Digite o nome da empresa."
    );

    return;

  }


  const endereco =
    prompt(
      "Endereço:",
      empresa.endereco
    );


  if(
    endereco === null
  ){

    return;

  }


  if(
    !endereco.trim()
  ){

    alert(
      "Digite o endereço."
    );

    return;

  }


  const funcionariosTexto =
    prompt(
      "Quantidade de funcionários:",
      empresa.funcionarios
    );


  if(
    funcionariosTexto === null
  ){

    return;

  }


  const funcionarios =
    Number(
      funcionariosTexto
    );


  if(
    !Number.isInteger(funcionarios)
    ||
    funcionarios < 1
  ){

    alert(
      "Digite uma quantidade válida de funcionários."
    );

    return;

  }


  const jornaisTexto =
    prompt(
      "Quantidade de jornais:",
      empresa.jornais
    );


  if(
    jornaisTexto === null
  ){

    return;

  }


  const jornais =
    Number(
      jornaisTexto
    );


  if(
    !Number.isInteger(jornais)
    ||
    jornais < 1
  ){

    alert(
      "Digite uma quantidade válida de jornais."
    );

    return;

  }


  const cidadeTexto =
    prompt(
      "Cidade:",
      empresa.cidade
    );


  if(
    cidadeTexto === null
  ){

    return;

  }


  if(
    !cidadeTexto.trim()
  ){

    alert(
      "Digite a cidade."
    );

    return;

  }


  if(
    !confirm(
      "Deseja salvar as alterações?"
    )
  ){

    return;

  }


  let coordenadas = {

    latitude:
      empresa.latitude,

    longitude:
      empresa.longitude

  };


  const enderecoMudou =
    endereco.trim() !==
    empresa.endereco;


  const cidadeMudou =
    cidadeTexto.trim() !==
    empresa.cidade;


  if(
    enderecoMudou ||
    cidadeMudou
  ){

    try{

      coordenadas =
        await obterCoordenadas(
          endereco.trim(),
          cidadeTexto.trim()
        );


    }catch(error){

      console.error(
        "Erro ao localizar novo endereço:",
        error
      );


      coordenadas =
        null;

    }

  }


  try{

    const empresaRef =
      doc(
        db,
        "empresas",
        empresa.id
      );


    const atualizacao = {

      nome:
        nome.trim(),

      endereco:
        endereco.trim(),

      funcionarios:
        funcionarios,

      jornais:
        jornais,

      cidade:
        cidadeTexto.trim(),

      latitude:
        coordenadas
        ?
        coordenadas.latitude
        :
        null,

      longitude:
        coordenadas
        ?
        coordenadas.longitude
        :
        null

    };


    await updateDoc(
      empresaRef,
      atualizacao
    );


    alert(
      "Empresa atualizada com sucesso!"
    );


    await mostrarEmpresas();


  }catch(error){

    console.error(
      "Erro ao editar empresa:",
      error
    );


    alert(
      "Erro ao atualizar a empresa."
    );

  }

}

    );

      );

    obsoletas.forEach(

          );

          document.createElement(

          );

          );

            "div"
          );

            "div"
          );

          (
            empresa.cidade ||
            ""
          );

          document.createElement(
            "div"
          );


        funcionarios.textContent =

            empresa.funcionarios ||
            0
          ) +
          " funcionários";


        const jornais =
          document.createElement(
            "div"
          );


        jornais.textContent =
          "📰 " +
          (
            empresa.jornais ||
            0
          ) +
          " jornais";


        card.appendChild(

        );


        card.appendChild(
          endereco
        );


        card.appendChild(

        );

        );

        );


        const botoes =

          );

          );

/* =========================================================
   PRÓXIMA ENTREGA POR DISTÂNCIA
   ========================================================= */


btnProximaEntrega.addEventListener(
  "click",
  async()=>{

    if(!usuarioAtual){

      alert(
        "Você precisa entrar primeiro."
      );

      return;

    }


    if(!cidade.value){

      alert(
        "Selecione uma cidade primeiro."
      );

      return;

    }


    try{

      const empresas =
        await buscarEmpresas();


      const pendentes =
        empresas.filter(
          empresa =>
            empresa.entregue !== true
        );


      if(
        pendentes.length === 0
      ){

        alert(
          "✅ Não há empresas pendentes nesta cidade."
        );

        return;

      }


      /*
        Obtém a localização atual.
      */

      lista.innerHTML = `

        <div class="progressoRota">

          📍 Obtendo sua localização...

          <br><br>

          Permita o acesso à localização quando o navegador pedir.

        </div>

      `;


      const minhaLocalizacao =
        await obterMinhaLocalizacao();


      /*
        Garante que todas as empresas
        tenham coordenadas.
      */

      const coordenadasOK =
        await garantirCoordenadas(
          pendentes
        );


      if(
        !coordenadasOK
      ){

        await mostrarEmpresas();

        return;

      }


      /*
        Calcula a distância de cada empresa.
      */

      /*
  Calcula a distância REAL pelas ruas
  entre sua localização e cada empresa.
*/

const empresasComDistancia = [];

const tamanhoLote = 50;

for(
  let inicio = 0;
  inicio < pendentes.length;
  inicio += tamanhoLote
){

  const lote =
    pendentes.slice(
      inicio,
      inicio + tamanhoLote
    );


  const coordenadas =
    [

      minhaLocalizacao.longitude +
      "," +
      minhaLocalizacao.latitude

    ].concat(

      lote.map(
        empresa =>
          empresa.longitude +
          "," +
          empresa.latitude
      )

    );


  const url =
    "https://router.project-osrm.org/table/v1/driving/" +
    coordenadas.join(";") +
    "?sources=0&annotations=distance";


  const resposta =
    await fetch(url);


  if(!resposta.ok){

    throw new Error(
      "Não foi possível calcular as distâncias pelas ruas."
    );

  }


  const dados =
    await resposta.json();


  if(
    !dados.distances ||
    !dados.distances[0]
  ){

    throw new Error(
      "O serviço de rotas não retornou as distâncias."
    );

  }


  const distancias =
    dados.distances[0];


  lote.forEach(
    (empresa,index)=>{

      const distanciaMetros =
        distancias[index + 1];


      if(
        typeof distanciaMetros === "number"
      ){

        empresasComDistancia.push({

          ...empresa,

          distanciaKm:
            distanciaMetros / 1000

        });

      }

    }
  );


  /*
    Pequena pausa entre os lotes.
  */

  if(
    inicio + tamanhoLote <
    pendentes.length
  ){

    await esperar(500);

  }

}


/*
  Ordena pela distância REAL
  pelas ruas.
*/

empresasComDistancia.sort(
  (a,b) =>
    a.distanciaKm -
    b.distanciaKm
);


const proxima =
  empresasComDistancia[0];


if(!proxima){

  throw new Error(
    "Não foi possível determinar a próxima empresa."
  );

}


const distancia =
  proxima.distanciaKm
    .toFixed(2);


      /*
        Mostra primeiro qual empresa foi escolhida.
      */

      lista.innerHTML = `

        <div class="progressoRota">

          📍 Próxima entrega encontrada

          <br><br>

          <strong>
            🏢 ${proxima.nome}
          </strong>

          <br><br>

          📏 Aproximadamente

          <strong>
            ${distancia} km
          </strong>

          de distância.

          <br><br>

          <span class="distanciaRota">
            📍 Distância calculada a partir da sua localização atual.
          </span>

        </div>

      `;


      await esperar(300);


      const destino =
        encodeURIComponent(

          proxima.endereco +
          ", " +
          proxima.cidade

        );


      const url =

        "https://www.google.com/maps/dir/?api=1" +

        "&destination=" +

        destino +

        "&travelmode=driving";


      lista.innerHTML += `

        <br>

        <button
          id="abrirGoogleMaps"
          style="
            background:#0d6efd;
            color:white;
            border:none;
            padding:14px 20px;
            border-radius:10px;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
          "
        >

          🗺️ Abrir rota no Google Maps

        </button>

      `;


      const botaoMapa =
        document.getElementById(
          "abrirGoogleMaps"
        );


      botaoMapa.addEventListener(
        "click",
        ()=>{

          window.open(
            url,
            "_blank"
          );

        }
      );


    }catch(error){

      console.error(
        "Erro na rota:",
        error
      );


      alert(
        error.message ||
        "Não foi possível calcular a próxima entrega."
      );


      await mostrarEmpresas();

    }

  }
);

onAuthStateChanged(
  auth,
  async function(usuario){

    if(usuario){

      usuarioAtual =
        usuario;


      try{

        const usuarioRef =
          doc(
            db,
            "usuarios",
            usuario.uid
          );


        const resultado =
          await getDoc(
            usuarioRef
          );


        // Se for o primeiro acesso,
        // cria automaticamente como usuário comum
        if(!resultado.exists()){

          await setDoc(
            usuarioRef,
            {
              tipo:"usuario",
              criadoEm:serverTimestamp()
            }
          );

        }


        // Descobre se é administrador e esconde
        // os botões de admin para o usuário comum
        const dadosUsuario =
          resultado.exists()
            ? resultado.data()
            : { tipo:"usuario" };

        ehAdmin =
          dadosUsuario.tipo === "admin";

        document.body.classList.toggle(
          "usuarioComum",
          !ehAdmin
        );


      }catch(error){

        console.error(
          "Erro ao verificar usuário:",
          error
        );

        alert(
          "Não foi possível carregar o cadastro do usuário."
        );

        return;

      }


      loginTela.style.display =
        "none";


      appTela.style.display =
        "block";


      usuarioEmail.textContent =
        "👤 " +
        usuario.email;


      await carregarCidades();


    }else{

      usuarioAtual =
        null;


      ehAdmin =
        false;


      document.body.classList.add(
        "usuarioComum"
      );


      appTela.style.display =
        "none";


      loginTela.style.display =
        "flex";

    }

  }
);
